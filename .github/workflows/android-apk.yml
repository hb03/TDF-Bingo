name: Android APKs bauen

# Baut zwei getrennte APKs aus den WebView-Wrappern (Ordner android/):
#   - TdF Bingo     (Modul :bingo,  bündelt index.html)
#   - Bombenspiel   (Modul :bombe,  bündelt bombe.html)
# Das Android-SDK ist auf den GitHub-Runnern vorinstalliert.

on:
  push:
    branches:
      - "claude/tour-de-france-bingo-app-jendbs"
      - "claude/bombe-spiel-spielerwechsel-77askv"
    paths:
      - "android/**"
      - "index.html"
      - "bombe.html"
      - "manifest.webmanifest"
      - "icons/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Web-Dateien in die App-Assets spiegeln
        run: |
          set -e
          # Bingo bekommt nur index.html, Bombenspiel nur bombe.html
          bingo=android/bingo/src/main/assets/www
          bombe=android/bombe/src/main/assets/www
          mkdir -p "$bingo/icons" "$bombe/icons"
          cp index.html manifest.webmanifest "$bingo"/
          cp icons/*.png "$bingo/icons/"
          cp bombe.html manifest.webmanifest "$bombe"/
          cp icons/*.png "$bombe/icons/"

      - name: JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle einrichten (mit Cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Beide APKs bauen (Release)
        working-directory: android
        run: ./gradlew --no-daemon :bingo:assembleRelease :bombe:assembleRelease

      - name: APKs sammeln & umbenennen
        run: |
          set -e
          mkdir -p out
          cp android/bingo/build/outputs/apk/release/bingo-release.apk out/tdf-bingo.apk
          cp android/bombe/build/outputs/apk/release/bombe-release.apk out/bombenspiel.apk
          ls -la out

      - name: APKs als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: out/*.apk
          if-no-files-found: error

      - name: Release „TdF Bingo“ veroeffentlichen
        if: github.ref == 'refs/heads/claude/tour-de-france-bingo-app-jendbs'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          notes="Installierbare APK von TdF Bingo. Auf dem Handy oeffnen und installieren (ggf. Installation aus unbekannten Quellen einmalig erlauben)."
          if gh release view bingo-latest >/dev/null 2>&1; then
            gh release upload bingo-latest out/tdf-bingo.apk --clobber
          else
            gh release create bingo-latest out/tdf-bingo.apk \
              --title "TdF Bingo (neueste APK)" --notes "$notes" --target "$GITHUB_SHA"
          fi

      - name: Release „Bombenspiel“ veroeffentlichen
        if: github.ref == 'refs/heads/claude/tour-de-france-bingo-app-jendbs'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          notes="Installierbare APK vom Bombenspiel. Auf dem Handy oeffnen und installieren (ggf. Installation aus unbekannten Quellen einmalig erlauben)."
          if gh release view bombe-latest >/dev/null 2>&1; then
            gh release upload bombe-latest out/bombenspiel.apk --clobber
          else
            gh release create bombe-latest out/bombenspiel.apk \
              --title "Bombenspiel (neueste APK)" --notes "$notes" --target "$GITHUB_SHA"
          fi
