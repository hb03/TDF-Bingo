plugins {
    id 'com.android.application'
}

android {
    namespace 'de.hb03.bombenspiel'
    compileSdk 34

    defaultConfig {
        applicationId 'de.hb03.bombenspiel'
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Release mit dem Debug-Schlüssel signieren, damit die APK ohne
            // eigenes Keystore-Setup direkt installierbar ist.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.core:core:1.13.1'
}
