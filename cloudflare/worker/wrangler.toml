name = "bingo-live"
main = "src/worker.js"
compatibility_date = "2024-11-01"

# Ein Durable Object pro Raum (WebSocket-Verteiler).
[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

# SQLite-backed Durable Objects sind auch im kostenlosen Workers-Plan nutzbar.
# (Wir speichern nichts dauerhaft – der Raum lebt nur, solange jemand verbunden ist.)
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
